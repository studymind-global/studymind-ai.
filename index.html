<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>NBSK AI</title>
  <!-- Фирменная футуристичная иконка-куб во вкладке -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%23050811'/%3E%3Cpolygon points='32,10 52,21 52,43 32,54 12,43 12,21' fill='none' stroke='%2338bdf8' stroke-width='4' stroke-linejoin='round'/%3E%3Cpolyline points='12,21 32,32 52,21' fill='none' stroke='%2338bdf8' stroke-width='3.5' stroke-linejoin='round'/%3E%3Cline x1='32' y1='32' x2='32' y2='54' stroke='%2338bdf8' stroke-width='3.5' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #050811;
      --glass: rgba(22, 28, 45, 0.65);
      --glass-solid: #111625;
      --border: rgba(255, 255, 255, 0.1);
      --cyan: #38bdf8;
      --indigo: #818cf8;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 25%, #0f1b38 0%, var(--bg) 65%);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Боковая шторка iOS */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 40;
      display: none;
    }
    .overlay.show { display: block; }

    .drawer {
      position: fixed;
      top: 0; left: 0; bottom: 0;
      width: 270px;
      background: rgba(11, 15, 26, 0.92);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--border);
      z-index: 50;
      transform: translateX(-100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      padding: calc(env(safe-area-inset-top) + 18px) 16px calc(env(safe-area-inset-bottom) + 18px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .drawer.open { transform: translateX(0); }

    .drawer-btn {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 500;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .drawer-btn span.tag {
      font-size: 11px;
      color: var(--cyan);
      background: rgba(56, 189, 248, 0.12);
      padding: 2px 8px;
      border-radius: 8px;
    }

    /* Стеклянный верхний бар как в iOS */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(env(safe-area-inset-top) + 10px) 16px 10px;
      background: rgba(5, 8, 17, 0.7);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
      z-index: 20;
    }

    .icon-circle {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: transparent;
      border: none;
      color: var(--text);
      display: grid;
      place-items: center;
      cursor: pointer;
    }
    .icon-circle:active { background: var(--glass); }

    .brand-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--glass);
      border: 1px solid var(--border);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.3px;
    }

    /* Центральная область */
    main {
      flex: 1;
      overflow-y: auto;
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 20px 16px;
      display: flex;
      flex-direction: column;
    }

    /* Минималистичный футуристичный экран приветствия */
    .hero {
      margin: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 18px;
    }

    .orb-wrap {
      position: relative;
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
    }

    .orb-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1.5px solid rgba(56, 189, 248, 0.35);
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.2);
      animation: spin 16s linear infinite;
    }
    .orb-ring::before {
      content: "";
      position: absolute;
      top: -3px; left: 50%;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: var(--cyan);
      box-shadow: 0 0 10px var(--cyan);
    }

    .orb-core {
      width: 68px;
      height: 68px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #e0f2fe, #38bdf8 45%, #4f46e5 85%, #090d16);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.55), inset 0 0 12px rgba(255, 255, 255, 0.8);
      animation: breathe 3.8s ease-in-out infinite;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }
    @keyframes breathe {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    .hero h1 {
      font-size: 23px;
      font-weight: 600;
      letter-spacing: -0.4px;
    }

    .hero p {
      font-size: 14px;
      color: var(--muted);
      max-width: 300px;
      line-height: 1.4;
    }

    /* Сообщения чата в стиле iMessage / iOS */
    .chat-list {
      display: none;
      flex-direction: column;
      gap: 14px;
      padding-bottom: 10px;
    }

    .msg {
      max-width: 82%;
      padding: 11px 16px;
      border-radius: 20px;
      font-size: 15px;
      line-height: 1.45;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, #2563eb, #4f46e5);
      color: #fff;
      border-bottom-right-radius: 6px;
      box-shadow: 0 4px 16px rgba(37, 99, 235, 0.25);
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      border-bottom-left-radius: 6px;
      backdrop-filter: blur(12px);
    }

    /* Нижняя панель ввода iPhone */
    footer {
      width: 100%;
      max-width: 720px;
      margin: 0 auto;
      padding: 8px 14px calc(env(safe-area-inset-bottom) + 12px);
    }

    .input-pill {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      background: var(--glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 26px;
      padding: 6px 8px 6px 10px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.4);
    }

    .input-pill:focus-within {
      border-color: rgba(56, 189, 248, 0.45);
    }

    .plus-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.08);
      border: none;
      color: var(--text);
      font-size: 19px;
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      font-size: 16px;
      line-height: 1.35;
      max-height: 110px;
      resize: none;
      outline: none;
      padding: 5px 2px;
    }

    textarea::placeholder { color: var(--muted); }

    .action-btn {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: none;
      background: transparent;
      color: var(--muted);
      display: grid;
      place-items: center;
      cursor: pointer;
      flex-shrink: 0;
    }

    .action-btn.send {
      background: #ffffff;
      color: #050811;
    }
  </style>
</head>
<body>

  <!-- Боковое меню iOS -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>
  <aside class="drawer" id="drawer">
    <button class="drawer-btn" onclick="resetChat()">
      <span>Новый чат</span>
      <span>✎</span>
    </button>
    <button class="drawer-btn" onclick="alert('Вход и регистрация по email появятся на следующем этапе.')">
      <span>Аккаунт</span>
      <span class="tag">Скоро</span>
    </button>
    <button class="drawer-btn" onclick="alert('Раздел Проекты для студентов — Скоро.')">
      <span>Проекты</span>
      <span class="tag">Скоро</span>
    </button>
    <button class="drawer-btn" onclick="alert('Синхронизация истории в облаке — Скоро.')">
      <span>Облачные чаты</span>
      <span class="tag">Скоро</span>
    </button>
  </aside>

  <!-- Стеклянная шапка -->
  <header>
    <button class="icon-circle" onclick="toggleMenu()" aria-label="Меню">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="4" y1="8" x2="20" y2="8"></line>
        <line x1="4" y1="16" x2="15" y2="16"></line>
      </svg>
    </button>

    <div class="brand-pill">
      <svg width="18" height="18" viewBox="0 0 64 64">
        <polygon points="32,6 56,20 56,44 32,58 8,44 8,20" fill="rgba(56,189,248,0.15)" stroke="#38bdf8" stroke-width="4.5" stroke-linejoin="round"/>
        <polyline points="8,20 32,34 56,20" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linejoin="round"/>
        <line x1="32" y1="34" x2="32" y2="58" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span>NBSK AI</span>
    </div>

    <button class="icon-circle" onclick="resetChat()" aria-label="Новый чат">

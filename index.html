<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBSK AI — Neural Core Interface</title>
  <!-- Фирменная иконка во вкладке браузера вместо серой планеты -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://w3.org' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2338bdf8'/%3E%3Cstop offset='100%25' stop-color='%23818cf8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='%23070b14'/%3E%3Ccircle cx='32' cy='32' r='18' fill='url(%23g)'/%3E%3Ccircle cx='32' cy='32' r='24' fill='none' stroke='%2338bdf8' stroke-width='2' stroke-dasharray='6 4'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg-deep: #070b14;
      --bg-card: rgba(16, 24, 40, 0.72);
      --border-glass: rgba(56, 189, 248, 0.25);
      --cyan: #38bdf8;
      --blue: #3b82f6;
      --purple: #818cf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 45%, #112240 0%, var(--bg-deep) 72%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 24px;
      overflow-x: hidden;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .logo-cube {
      width: 26px;
      height: 26px;
      border: 2px solid var(--cyan);
      border-radius: 7px;
      transform: rotate(45deg);
      display: grid;
      place-items: center;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
    }

    .logo-cube::after {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--cyan);
      border-radius: 2px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-soon {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-muted);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      cursor: pointer;
      transition: 0.2s;
    }

    .badge-soon:hover {
      border-color: var(--cyan);
      color: #fff;
    }

    .dashboard {
      display: grid;
      grid-template-columns: 300px 1fr 300px;
      gap: 20px;
      align-items: center;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1050px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
      .side-col {
        display: none;
      }
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
    }

    .hex-badge {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      background: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: grid;
      place-items: center;
      font-size: 15px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    .wave-svg {
      width: 100%;
      height: 34px;
      stroke: var(--cyan);
      fill: rgba(56, 189, 248, 0.12);
      stroke-width: 2;
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-line:last-child { border-bottom: none; }
    .stat-val { color: var(--cyan); font-weight: 600; }

    /* Центральная сфера Neural Core Orb и чат */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .orb-label {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-glass);
      padding: 6px 16px;
      border-radius: 12px;
      text-align: center;
    }

    .orb-label b { display: block; font-size: 13px; color: #fff; }
    .orb-label span { color: var(--text-muted); font-size: 11px; }

    .core-wrapper {
      position: relative;
      width: 230px;
      height: 230px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.45);
      animation: spinCW 22s linear infinite;
    }

    .ring-middle {
      position: absolute;
      inset: 20px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--cyan);
      border-bottom-color: var(--purple);
      animation: spinCCW 10s linear infinite;
    }

    .ring-inner {
      position: absolute;
      inset: 40px;
      border-radius: 50%;
      border: 1px solid rgba(125, 211, 252, 0.6);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
    }

    .core-sphere {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e0f2fe, #38bdf8 40%, #1d4ed8 75%, #090d16 100%);
      box-shadow:
        0 0 45px rgba(56, 189, 248, 0.8),
        0 0 90px rgba(59, 130, 246, 0.45),
        inset 0 0 20px #ffffff;
      animation: corePulse 3.2s ease-in-out infinite;
    }

    @keyframes spinCW { 100% { transform: rotate(360deg); } }
    @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
    @keyframes corePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    .neural-console {
      width: 100%;
      max-width: 540px;
      background: rgba(10, 16, 30, 0.9);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 14px;
      backdrop-filter: blur(16px);
    }

    .console-log {
      max-height: 170px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.5;
      color: #e2e8f0;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      white-space: pre-wrap;
    }

    .console-msg.user {
      color: var(--cyan);
      align-self: flex-end;
    }

    .console-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .console-input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 10px 12px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .console-input-row input:focus {
      border-color: var(--cyan);
    }

    .tool-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      cursor: pointer;
      display: grid;
      place-items: center;
      font-size: 16px;
    }

    .console-btn {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      color: #050811;
      font-weight: 700;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    footer {
      max-width: 1440px;
      width: 100%;
      margin: 14px auto 0;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 18px;
    }

    .timeline-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-btn {
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 16px;
      cursor: pointer;
    }

    .track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      position: relative;
    }

    .track-fill {
      width: 35%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      border-radius: 4px;
      position: relative;
    }

    .track-fill::after {
      content: "";
      position: absolute;
      right: -5px;
      top: -4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px var(--cyan);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">
      <div class="logo-cube"></div>
      <span>NBSK AI</span>
    </div>

    <div class="user-controls">
      <button class="badge-soon" onclick="alert('Регистрация и вход по email появятся на следующем этапе.')">Аккаунт • Скоро</button>
      <button class="badge-soon" onclick="alert('Раздел Проекты для студентов — Скоро.')">Проекты • Скоро</button>
      <button class="badge-soon" onclick="clearLog()">Очистить чат</button>
    </div>
  </header>

  <section class="dashboard">
    <!-- Левая колонка -->
    <div class="side-col">
      <div class="glass-card" style="width: 82%; align-self: flex-end;">

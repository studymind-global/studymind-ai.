<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NBSK AI — Neural Core Interface</title>
  <style>
    :root {
      --bg-deep: #070b14;
      --bg-card: rgba(16, 24, 40, 0.68);
      --border-glass: rgba(56, 189, 248, 0.22);
      --cyan: #38bdf8;
      --blue: #3b82f6;
      --purple: #818cf8;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 45%, #112240 0%, var(--bg-deep) 72%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 18px 26px;
      overflow-x: hidden;
    }

    /* Верхняя панель как на макете */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.6px;
    }

    .logo-cube {
      width: 28px;
      height: 28px;
      border: 2px solid var(--cyan);
      border-radius: 7px;
      transform: rotate(45deg);
      display: grid;
      place-items: center;
      box-shadow: 0 0 14px rgba(56, 189, 248, 0.45);
    }

    .logo-cube::after {
      content: "";
      width: 10px;
      height: 10px;
      background: var(--cyan);
      border-radius: 2px;
    }

    .user-controls {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .user-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }

    .icon-btn {
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      color: var(--text-main);
      width: 34px;
      height: 34px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: 0.2s;
    }

    .icon-btn:hover {
      border-color: var(--cyan);
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
    }

    /* Основная сетка дашборда (3 колонки как на фото) */
    .dashboard {
      display: grid;
      grid-template-columns: 310px 1fr 310px;
      gap: 20px;
      align-items: center;
      flex: 1;
      max-width: 1440px;
      width: 100%;
      margin: 0 auto;
    }

    @media (max-width: 1100px) {
      .dashboard {
        grid-template-columns: 1fr;
      }
    }

    .side-col {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .card-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Стеклянные виджеты */
    .glass-card {
      background: var(--bg-card);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      transition: 0.25s;
    }

    .glass-card:hover {
      border-color: rgba(56, 189, 248, 0.55);
    }

    .card-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .hex-badge {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.25), rgba(129, 140, 248, 0.25));
      border: 1px solid rgba(56, 189, 248, 0.4);
      display: grid;
      place-items: center;
      font-size: 16px;
      flex-shrink: 0;
    }

    .card-title {
      font-size: 13px;
      font-weight: 600;
      color: #fff;
    }

    .card-sub {
      font-size: 11px;
      color: var(--text-muted);
    }

    /* Мини-графики SVG */
    .wave-svg {
      width: 100%;
      height: 36px;
      stroke: var(--cyan);
      fill: rgba(56, 189, 248, 0.12);
      stroke-width: 2;
    }

    .metric-big {
      font-size: 18px;
      font-weight: 700;
      color: var(--cyan);
      margin-top: 6px;
    }

    .stat-line {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 4px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .stat-line:last-child { border-bottom: none; }
    .stat-val { color: var(--cyan); font-weight: 600; }

    /* Центральная сфера Neural Core Orb */
    .center-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      gap: 16px;
    }

    .orb-label {
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--border-glass);
      padding: 6px 16px;
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      z-index: 2;
    }

    .orb-label b { display: block; font-size: 13px; color: #fff; }
    .orb-label span { color: var(--text-muted); font-size: 11px; }

    .core-wrapper {
      position: relative;
      width: 260px;
      height: 260px;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .ring-outer {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 2px dashed rgba(56, 189, 248, 0.45);
      animation: spinCW 22s linear infinite;
    }

    .ring-middle {
      position: absolute;
      inset: 22px;
      border-radius: 50%;
      border: 3px solid transparent;
      border-top-color: var(--cyan);
      border-bottom-color: var(--purple);
      animation: spinCCW 10s linear infinite;
    }

    .ring-inner {
      position: absolute;
      inset: 44px;
      border-radius: 50%;
      border: 1px solid rgba(125, 211, 252, 0.6);
      box-shadow: 0 0 30px rgba(56, 189, 248, 0.35);
    }

    .core-sphere {
      width: 125px;
      height: 125px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #e0f2fe, #38bdf8 40%, #1d4ed8 75%, #090d16 100%);
      box-shadow:
        0 0 45px rgba(56, 189, 248, 0.8),
        0 0 90px rgba(59, 130, 246, 0.45),
        inset 0 0 20px #ffffff;
      animation: corePulse 3.2s ease-in-out infinite;
    }

    @keyframes spinCW { 100% { transform: rotate(360deg); } }
    @keyframes spinCCW { 100% { transform: rotate(-360deg); } }
    @keyframes corePulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.07); }
    }

    /* Встроенный интерактивный чат под сферой */
    .neural-console {
      width: 100%;
      max-width: 520px;
      background: rgba(10, 16, 30, 0.85);
      border: 1px solid var(--border-glass);
      border-radius: 16px;
      padding: 12px;
      backdrop-filter: blur(16px);
    }

    .console-log {
      max-height: 140px;
      overflow-y: auto;
      font-size: 13px;
      line-height: 1.45;
      color: #e2e8f0;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .console-msg.user {
      color: var(--cyan);
      align-self: flex-end;
    }

    .console-input-row {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .console-input-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-glass);
      border-radius: 10px;
      padding: 9px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
    }

    .console-input-row input:focus {
      border-color: var(--cyan);
    }

    .console-btn {
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      border: none;
      color: #050811;
      font-weight: 700;
      padding: 9px 14px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 13px;
    }

    /* Нижняя панель Timeline Scrubber как на фото */
    footer {
      max-width: 1440px;
      width: 100%;
      margin: 14px auto 0;
      background: var(--bg-card);
      border: 1px solid var(--border-glass);
      border-radius: 14px;
      padding: 10px 18px;
    }

    .timeline-top {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .timeline-bar {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .play-btn {
      background: none;
      border: none;
      color: var(--cyan);
      font-size: 16px;
      cursor: pointer;
    }

    .track {
      flex: 1;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      position: relative;
    }

    .track-fill {
      width: 42%;
      height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--purple));
      border-radius: 4px;
      position: relative;
    }

    .track-fill::after {
      content: "";
      position: absolute;
      right: -5px;
      top: -4px;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 10px var(--cyan);
    }
  </style>
</head>
<body>

  <!-- Верхняя панель -->
  <header>
    <div class="logo">
      <div class="logo-cube"></div>
      <span>NBSK AI</span>
    </div>

    <div class="user-controls">
      <div class="user-pill">
        <span class="status-dot"></span>
        <span>Neural Core Active</span>
      </div>
      <button class="icon-btn" title="Голосовой режим" onclick="startVoice()">🎤</button>
      <button class="icon-btn" title="Загрузить файл" onclick="document.getElementById('fileUpload').click()">📎</button>
      <input type="file" id="fileUpload" hidden onchange="alert('Файл загружен в Neural Core: ' + this.files.name)" />
    </div>
  </header>

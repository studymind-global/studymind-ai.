<!DOCTYPE html>
<html lang="ru" translate="no">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NBSK AI</title>
<meta name="description" content="NBSK AI — личный ИИ-помощник для учёбы: домашние задания, математика, английский.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1816; --surface:#252220; --surface2:#2d2926; --sidebar:#141211;
  --ink:#e8e4de; --mute:#9a948b;
  --line:rgba(255,255,255,.08); --fill:rgba(255,255,255,.06); --glass:rgba(37,34,32,.82);
  --accent:#d9644a; --accent2:#e8a24a; --grad:linear-gradient(135deg,#e0674d,#e8a24a);
  --shadow:0 6px 24px rgba(0,0,0,.28);
}
@media (prefers-color-scheme:light){:root{
  --bg:#f6f2ec; --surface:#fffdf9; --surface2:#ece6dd; --sidebar:#efe9e0;
  --ink:#2b2622; --mute:#7a7268;
  --line:rgba(60,45,30,.12); --fill:rgba(60,45,30,.06); --glass:rgba(255,253,249,.82);
  --shadow:0 6px 24px rgba(60,45,30,.09);
}}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display",Inter,system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink);display:flex;gap:12px;padding:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:3px solid rgba(217,100,74,.55);outline-offset:2px}

.side{width:288px;flex:none;display:flex;flex-direction:column;gap:10px;padding:16px 12px;border-radius:26px;z-index:30;background:var(--glass);border:.5px solid var(--line);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);transition:transform .3s cubic-bezier(.32,.72,0,1)}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 6px;font-weight:700;font-size:20px;letter-spacing:-.3px}
.brand small{font-weight:700;color:var(--accent)}
.newchat{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:13px 14px;border-radius:14px;background:var(--accent);font-weight:600;color:#fff;transition:transform .12s,opacity .15s}
.newchat:hover{opacity:.9}
.newchat:active{transform:scale(.97)}
.search{width:100%;padding:10px 14px;border-radius:12px;background:var(--fill);border:0;color:var(--ink);font:inherit;font-size:15px}
.search::placeholder{color:var(--mute)}
.nav{display:flex;flex-direction:column;border-radius:14px;background:var(--surface);overflow:hidden}
.navitem{display:flex;align-items:center;justify-content:space-between;width:100%;padding:12px 14px;font-size:15px;text-align:left}
.navitem+.navitem{border-top:.5px solid var(--line)}
.navitem:hover{background:var(--fill)}
.soon{font-size:11px;font-weight:600;color:var(--mute);background:var(--fill);padding:3px 9px;border-radius:20px}
.label{font-size:13px;color:var(--mute);padding:6px 14px 0;font-weight:500}
.history{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;min-height:60px}
.hitem{display:flex;align-items:center;border-radius:12px}
.hitem:hover{background:var(--fill)}
.hitem.active{background:rgba(217,100,74,.18)}
.htitle{flex:1;text-align:left;padding:10px 14px;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hdel{padding:6px 12px;color:var(--mute);opacity:0}
.hitem:hover .hdel,.hdel:focus-visible{opacity:1}
.hdel:hover{color:#ff453a}
.empty-h{color:var(--mute);font-size:14px;padding:8px 14px}
.profile{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:16px;background:var(--surface)}
.ava{width:36px;height:36px;border-radius:50%;background:var(--grad);display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.pinfo{flex:1;line-height:1.25}
.pinfo b{font-size:15px;font-weight:600;display:block}
.pinfo span{font-size:12px;color:var(--mute)}

.main{flex:1;min-width:0;display:flex;flex-direction:column;position:relative}
.top{display:none;align-items:center;gap:12px;padding:10px 14px;font-weight:600}
.burger{padding:7px 12px;border-radius:12px;background:var(--glass);border:.5px solid var(--line);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.scroll{flex:1;overflow-y:auto;display:flex;flex-direction:column}
.welcome{margin:auto;text-align:center;padding:20px;max-width:780px;width:100%}
.mark{width:60px;height:60px;margin:0 auto 18px;filter:drop-shadow(0 8px 24px rgba(217,100,74,.45))}
.welcome h1{font-size:clamp(30px,4.6vw,44px);font-weight:700;letter-spacing:-1.2px;line-height:1.1;margin-bottom:10px}
.welcome p{color:var(--mute);margin:0 auto 26px;line-height:1.5;max-width:460px;font-size:16px}
.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;text-align:left}
.card{text-align:left;display:flex;align-items:center;gap:14px;padding:12px 14px;border-radius:18px;background:var(--surface);transition:transform .12s,background .15s}
.card:hover{background:var(--surface2)}
.card:active{transform:scale(.98)}
.card i{font-style:normal;flex:none;width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:22px;background:hsl(var(--h,255) 78% 52%)}
.card div{flex:1;min-width:0}
.card b{display:block;font-size:16px;font-weight:600}
.card span{display:block;font-size:13px;color:var(--mute);margin-top:1px}
.card::after{content:"›";font-size:24px;color:var(--mute);opacity:.6;line-height:1}
.msgs{width:100%;max-width:760px;margin:0 auto;padding:24px 18px;display:flex;flex-direction:column;gap:10px}
.msg{display:flex;flex-direction:column;gap:6px;max-width:82%;animation:in .22s ease-out}
.msg.user{align-self:flex-end;align-items:flex-end}
.msg.ai{align-self:flex-start}
.bubble{padding:10px 16px;line-height:1.5;white-space:pre-wrap;word-wrap:break-word;font-size:16px}
.user .bubble{background:var(--accent);color:#fff;border-radius:22px 22px 6px 22px}
.ai .bubble{background:var(--surface2);border-radius:22px 22px 22px 6px}
.files{display:flex;flex-wrap:wrap;gap:6px}
.file{font-size:12px;padding:6px 11px;border-radius:10px;background:var(--fill);color:var(--ink);max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}

.dock{padding:8px 8px calc(6px + env(safe-area-inset-bottom,0px));width:100%;max-width:780px;margin:0 auto}
.box{background:var(--glass);border:.5px solid var(--line);border-radius:28px;padding:10px 10px 8px 14px;backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s}
.box:focus-within{border-color:rgba(217,100,74,.7);box-shadow:var(--shadow),0 0 0 4px rgba(217,100,74,.18)}
.pending{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.pending:empty{display:none}
.pfile{display:flex;align-items:center;gap:8px;font-size:13px;padding:7px 9px 7px 12px;border-radius:12px;background:var(--fill);max-width:240px}
.pfile span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pfile button{color:var(--mute);padding:0 4px}
.pfile button:hover{color:#ff453a}
textarea{width:100%;background:none;border:0;color:var(--ink);font:inherit;font-size:16px;line-height:1.5;resize:none;max-height:200px;outline:none;padding:6px 4px}
textarea::placeholder{color:var(--mute)}
.row{display:flex;align-items:center;gap:2px;margin-top:2px}
.ibtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.ibtn:hover{background:var(--fill);color:var(--ink)}
.sp{flex:1}
.send{width:36px;height:36px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;transition:transform .12s,opacity .15s}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.3;cursor:default}
.note{text-align:center;font-size:12px;color:var(--mute);margin-top:10px}

.shade{display:none}
@media(max-width:820px){
  body{padding:0;gap:0}
  .side{position:fixed;inset:10px auto 10px 10px;transform:translateX(-110%);width:min(310px,88vw)}
  .side.open{transform:none}
  .shade.show{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20}
  .top{display:flex}
  .msg{max-width:90%}
  .cards{grid-template-columns:1fr}
  .dock{padding-left:10px;padding-right:10px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Стиль ChatGPT: плоская панель, ответы без пузырей, поле ввода в одну строку */
body{padding:0;gap:0}
.side{border-radius:0;border:0;border-right:.5px solid var(--line);background:var(--sidebar);backdrop-filter:none;-webkit-backdrop-filter:none;padding:12px 10px}
.newchat{background:none;color:var(--ink);justify-content:flex-start;border-radius:10px;padding:10px 12px;font-weight:500}
.newchat:hover{background:var(--fill);opacity:1}
.nav{background:none;border-radius:0}
.navitem{border-radius:10px}
.navitem+.navitem{border-top:0}
.profile{background:none}
.top{display:flex;padding:14px 20px;font-size:17px;font-weight:600}
.burger{display:none}
.msgs{gap:28px}
.msg{max-width:100%}
.msg.user{max-width:80%}
.user .bubble{background:var(--surface);color:var(--ink);border-radius:24px;padding:10px 18px}
.ai .bubble{background:none;border-radius:0;padding:0;line-height:1.75}
.box{display:flex;flex-wrap:wrap;align-items:flex-end;gap:2px;border-radius:30px;background:var(--surface);border:0;padding:8px 10px;backdrop-filter:none;-webkit-backdrop-filter:none;box-shadow:none}
.box:focus-within{box-shadow:0 0 0 1px var(--line)}
.pending{flex:0 0 100%;order:-1;padding:4px 6px 0}
.row{display:contents}
.sp{display:none}
#fileBtn{order:1}
#photoBtn{order:2}
textarea{order:3;flex:1;width:auto;min-width:0;padding:9px 6px}
.send{order:4;margin-bottom:1px}
@media(max-width:820px){
  .side{inset:0 auto 0 0;width:min(310px,86vw)}
  .burger{display:block}
  .top{padding:10px 14px}
}
.sw{position:relative}
.sw .search{padding-right:42px}
.sw .ibtn{position:absolute;right:2px;top:2px;width:34px;height:34px}
#micBtn{order:4}
.send{order:5}
.ibtn.rec{color:#fff;background:#d9534f;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(217,83,79,.4)}100%{box-shadow:0 0 0 12px rgba(217,83,79,0)}}
textarea:focus,textarea:focus-visible{outline:none!important}
</style>
</head>
<body>

<aside class="side" id="side">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0674d"/><stop offset="1" stop-color="#e8a24a"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g1)"/><path d="M19 47V17l26 30V17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <div>NBSK <small>AI</small></div>
  </div>

  <button class="newchat" id="newBtn">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    Новый чат
  </button>

  <div class="sw"><input class="search" id="search" type="search" placeholder="Поиск по чатам" aria-label="Поиск по чатам"><button class="ibtn" id="micSearch" aria-label="Голосовой поиск" title="Голосовой поиск"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button></div>

  <div class="nav">
    <button class="navitem" data-soon="Проекты">Проекты <span class="soon">Скоро</span></button>
    <button class="navitem" data-soon="Коннекторы">Коннекторы <span class="soon">Скоро</span></button>
  </div>

  <div class="label">История</div>
  <div class="history" id="history"></div>

  <div class="profile">
    <div class="ava">Г</div>
    <div class="pinfo"><b>Гость</b><span>Вход появится скоро</span></div>
    <button class="ibtn" data-soon="Настройки" aria-label="Настройки">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
</aside>
<div class="shade" id="shade"></div>

<main class="main">
  <div class="top">
    <button class="burger" id="burger" aria-label="Открыть меню">☰</button>
    <b>NBSK AI</b>
  </div>

  <div class="scroll" id="scroll"></div>

  <div class="dock">
    <div class="box">
      <div class="pending" id="pending"></div>
      <textarea id="input" rows="1" placeholder="Напишите вопрос или прикрепите файл…" aria-label="Сообщение"></textarea>
      <div class="row">
        <button class="ibtn" id="fileBtn" aria-label="Прикрепить файлы" title="Прикрепить файлы">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.5l-8.6 8.6a5.5 5.5 0 0 1-7.8-7.8l9-9a3.7 3.7 0 0 1 5.2 5.2l-9 9a1.8 1.8 0 0 1-2.6-2.6l8.4-8.4"/></svg>
        </button>
        <button class="ibtn" id="photoBtn" aria-label="Загрузить фото" title="Загрузить фото">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="M21 16l-5-5-8 9"/></svg>
        </button>
        <div class="sp"></div>
        <button class="ibtn" id="micBtn" aria-label="Голосовой ввод" title="Голосовой ввод"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button>
        <button class="send" id="sendBtn" aria-label="Отправить" disabled>
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
      <input type="file" id="fileIn" multiple hidden>
      <input type="file" id="photoIn" accept="image/*" multiple hidden>
    </div>
    <div class="note" id="note">Первая версия интерфейса. ИИ пока не подключён.</div>
  </div>
</main>

<script>
(function(){
  var KEY = "nbsk_chats_v1";
  var chats = [], activeId = null, pending = [];
  var $ = function(id){ return document.getElementById(id); };

  function load(){
    try { chats = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ chats = []; }
  }
  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(chats)); } catch(e){}
  }
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,6); }
  function active(){ return chats.filter(function(c){ return c.id === activeId; })[0]; }

  function newChat(){
    var cur = active();
    if (cur && cur.messages.length === 0) { closeMenu(); render(); $("input").focus(); return; }
    var c = { id: uid(), title: "Новый чат", messages: [], updated: Date.now() };
    chats.unshift(c); activeId = c.id; save(); pending = [];
    closeMenu(); render(); $("input").focus();
  }

  function el(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function renderHistory(){
    var box = $("history"), q = $("search").value.trim().toLowerCase();
    box.textContent = "";
    var list = chats.filter(function(c){
      if (!c.messages.length && c.id !== activeId) return false;
      return !q || c.title.toLowerCase().indexOf(q) !== -1;
    });
    if (!list.length) { box.appendChild(el("div","empty-h", q ? "Ничего не найдено" : "Пока нет чатов")); return; }
    list.forEach(function(c){
      var row = el("div", "hitem" + (c.id === activeId ? " active" : ""));
      var t = el("button","htitle", c.title);
      t.onclick = function(){ activeId = c.id; pending = []; closeMenu(); render(); };
      var d = el("button","hdel","✕"); d.setAttribute("aria-label","Удалить чат");
      d.onclick = function(){
        if (!confirm("Удалить этот чат?")) return;
        chats = chats.filter(function(x){ return x.id !== c.id; });
        if (activeId === c.id) { activeId = chats.length ? chats[0].id : null; }
        if (!activeId) { newChat(); return; }
        save(); render();
      };
      row.appendChild(t); row.appendChild(d); box.appendChild(row);
    });
  }

  function renderMain(){
    var s = $("scroll"), c = active();
    s.textContent = "";
    if (!c || !c.messages.length) {
      var w = el("div","welcome");
      w.innerHTML = '<svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><defs><linearGradient id="g2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0674d"/><stop offset="1" stop-color="#e8a24a"/></linearGradient></defs><rect width="64" height="64" rx="18" fill="url(#g2)"/><path d="M19 47V17l26 30V17" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
      w.appendChild(el("h1","","Привет! Что учим сегодня?"));
      w.appendChild(el("p","","Выберите предмет или задайте свой вопрос. Можно прикрепить фото задания или файл."));
      s.appendChild(w);
    } else {
      var m = el("div","msgs");
      c.messages.forEach(function(msg){
        var d = el("div","msg " + (msg.role === "user" ? "user" : "ai"));
        if (msg.files && msg.files.length) {
          var f = el("div","files");
          msg.files.forEach(function(n){ f.appendChild(el("span","file","📎 " + n)); });
          d.appendChild(f);
        }
        if (msg.text) d.appendChild(el("div","bubble", msg.text));
        m.appendChild(d);
      });
      s.appendChild(m); s.scrollTop = s.scrollHeight;
    }
  }

  function renderPending(){
    var p = $("pending"); p.textContent = "";
    pending.forEach(function(f, i){
      var r = el("div","pfile"); r.appendChild(el("span","", (f.type.indexOf("image/")===0 ? "🖼 " : "📎 ") + f.name));
      var x = el("button","","✕"); x.setAttribute("aria-label","Убрать файл");
      x.onclick = function(){ pending.splice(i,1); renderPending(); updateSend(); };
      r.appendChild(x); p.appendChild(r);
    });
  }

  function render(){ renderHistory(); renderMain(); renderPending(); updateSend(); }

  function updateSend(){ $("sendBtn").disabled = !($("input").value.trim() || pending.length); }
  function autosize(){ var t = $("input"); t.style.height = "auto"; t.style.height = Math.min(t.scrollHeight, 200) + "px"; }

  function send(){
    var text = $("input").value.trim();
    if (!text && !pending.length) return;
    var c = active(); if (!c) { newChat(); c = active(); }
    var names = pending.map(function(f){ return f.name; });
    c.messages.push({ role:"user", text:text, files:names });
    if (c.title === "Новый чат") c.title = (text || names[0]).slice(0, 40);
    c.messages.push({ role:"ai", text:"ИИ пока не подключён: это первая версия интерфейса NBSK AI. Ваше сообщение" + (names.length ? " и список файлов" : "") + " сохранено в этом чате. Настоящие ответы появятся на этапе подключения ИИ.", files:[] });
    c.updated = Date.now();
    $("input").value = ""; pending = []; autosize(); save(); render();
  }

  function addFiles(list){
    Array.prototype.forEach.call(list, function(f){ pending.push({ name:f.name, type:f.type || "" }); });
    renderPending(); updateSend();
  }

  function openMenu(){ $("side").classList.add("open"); $("shade").classList.add("show"); }
  function closeMenu(){ $("side").classList.remove("open"); $("shade").classList.remove("show"); }

  var noteTimer;
  function soon(name){
    var n = $("note"); n.textContent = "«" + name + "» — скоро. Этот раздел ещё не готов.";
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function(){ n.textContent = "Первая версия интерфейса. ИИ пока не подключён."; }, 3500);
    closeMenu();
  }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  var rec = null, recBtn = null;
  function flash(msg){
    var n = $("note"); n.textContent = msg;
    clearTimeout(noteTimer);
    noteTimer = setTimeout(function(){ n.textContent = "Первая версия интерфейса. ИИ пока не подключён."; }, 5000);
  }
  function voice(btn, input){
    if (!SR) { flash("Голосовой ввод не поддерживается в этом браузере. Откройте сайт в Chrome, Edge или Safari."); return; }
    if (rec) { var same = (recBtn === btn); try { rec.stop(); } catch(e){} if (same) return; }
    var r = new SR();
    r.lang = "ru-RU"; r.interimResults = true; r.continuous = false;
    var start = input.value ? input.value.replace(/\s*$/, " ") : "";
    r.onresult = function(e){
      var t = "";
      for (var i = 0; i < e.results.length; i++) t += e.results[i][0].transcript;
      input.value = start + t;
      input.dispatchEvent(new Event("input"));
    };
    r.onerror = function(e){
      if (e.error === "not-allowed" || e.error === "service-not-allowed") flash("Нет доступа к микрофону. Разрешите его через значок замка в адресной строке.");
      else if (e.error === "no-speech") flash("Речь не распознана. Попробуйте ещё раз.");
      else if (e.error !== "aborted") flash("Ошибка голосового ввода: " + e.error);
    };
    r.onend = function(){ btn.classList.remove("rec"); if (rec === r) { rec = null; recBtn = null; } };
    rec = r; recBtn = btn; btn.classList.add("rec");
    try { r.start(); } catch(e){ btn.classList.remove("rec"); rec = null; recBtn = null; }
  }
  $("micBtn").onclick = function(){ voice($("micBtn"), $("input")); };
  $("micSearch").onclick = function(){ voice($("micSearch"), $("search")); };

  $("newBtn").onclick = newChat;
  $("sendBtn").onclick = send;
  $("search").oninput = renderHistory;
  $("burger").onclick = openMenu;
  $("shade").onclick = closeMenu;
  $("fileBtn").onclick = function(){ $("fileIn").click(); };
  $("photoBtn").onclick = function(){ $("photoIn").click(); };
  $("fileIn").onchange = function(e){ addFiles(e.target.files); e.target.value = ""; };
  $("photoIn").onchange = function(e){ addFiles(e.target.files); e.target.value = ""; };
  $("input").oninput = function(){ autosize(); updateSend(); };
  $("input").onkeydown = function(e){
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
  };
  Array.prototype.forEach.call(document.querySelectorAll("[data-soon]"), function(b){
    b.onclick = function(){ soon(b.getAttribute("data-soon")); };
  });

  load();
  if (chats.length) { activeId = chats[0].id; } else { var c = { id: uid(), title: "Новый чат", messages: [], updated: Date.now() }; chats.push(c); activeId = c.id; }
  render();
})();
</script>
</body>
</html>

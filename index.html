<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>NBSK AI — Neural Intelligence</title>
  <style>
    :root {
      --bg-dark: #060913;
      --bg-panel: rgba(14, 21, 38, 0.72);
      --border-glow: rgba(56, 189, 248, 0.25);
      --accent-cyan: #38bdf8;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background: radial-gradient(circle at 50% 15%, #0f1c38 0%, var(--bg-dark) 70%);
      color: var(--text-main);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Верхняя панель */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: rgba(6, 9, 19, 0.8);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-glow);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 18px;
      letter-spacing: 0.5px;
    }

    .brand-icon {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      box-shadow: 0 0 15px rgba(56, 189, 248, 0.5);
      display: grid;
      place-items: center;
      font-size: 14px;
    }

    .model-select {
      background: var(--bg-panel);
      color: var(--text-main);
      border: 1px solid var(--border-glow);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      outline: none;
      cursor: pointer;
    }

    .pro-badge {
      background: linear-gradient(90deg, var(--accent-blue), var(--accent-purple));
      border: none;
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.4);
    }

    /* Основная область */
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      overflow-y: auto;
      padding: 20px 16px 10px;
      max-width: 900px;
      width: 100%;
      margin: 0 auto;
    }

    /* Приветственный экран с 3D-сферой */
    .hero-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      margin: auto 0;
      width: 100%;
    }

    .neural-orb {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #7dd3fc, #2563eb 55%, #1e1b4b 90%);
      box-shadow:
        0 0 40px rgba(56, 189, 248, 0.5),
        0 0 80px rgba(139, 92, 246, 0.3),
        inset 0 0 25px rgba(255, 255, 255, 0.4);
      position: relative;
      animation: pulseOrb 4s ease-in-out infinite;
      margin-bottom: 24px;
    }

    .neural-orb::after {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      border: 1px dashed rgba(56, 189, 248, 0.45);
      animation: spinRing 14s linear infinite;
    }

    @keyframes pulseOrb {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .hero-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #fff, #7dd3fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero-sub {
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 24px;
    }

    /* Карточки быстрых функций */
    .quick-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      width: 100%;
      max-width: 600px;
    }

    @media (min-width: 640px) {
      .quick-grid { grid-template-columns: repeat(4, 1fr); }
    }

    .quick-card {
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-radius: 14px;
      padding: 14px 12px;
      text-align: left;
      cursor: pointer;
      transition: 0.2s;
    }

    .quick-card:hover {
      border-color: var(--accent-cyan);
      transform: translateY(-2px);
      background: rgba(20, 32, 58, 0.9);
    }

    .quick-card span {
      display: block;
      font-size: 18px;
      margin-bottom: 6px;
    }

    .quick-card b {
      display: block;
      font-size: 13px;
      margin-bottom: 3px;
    }

    .quick-card small {
      color: var(--text-muted);
      font-size: 11px;
    }

    /* Чат */
    .chat-box {
      display: none;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      padding-bottom: 16px;
    }

    .msg {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .msg.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.ai {
      align-self: flex-start;
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-bottom-left-radius: 4px;
    }

    /* Нижняя панель ввода */
    .input-area {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 10px 16px 18px;
      background: linear-gradient(to top, var(--bg-dark) 75%, transparent);
    }

    .input-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--bg-panel);
      border: 1px solid var(--border-glow);
      border-radius: 24px;
      padding: 8px 12px;
      backdrop-filter: blur(14px);
      box-shadow: 0 4px 25px rgba(0, 0, 0, 0.4);
    }

    .input-wrap:focus-within {
      border-color: var(--accent-cyan);
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 18px;
      cursor: pointer;
      padding: 6px;
      border-radius: 50%;
      transition: 0.2s;
    }

    .icon-btn:hover {
      color: var(--accent-cyan);
      background: rgba(56, 189, 248, 0.1);
    }

    .icon-btn.recording {
      color: #ef4444;
      animation: pulseOrb 1s infinite;
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text-main);
      font-size: 15px;
      resize: none;
      max-height: 110px;
      outline: none;
      padding: 6px 4px;
    }

    .send-btn {
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-blue));
      border: none;
      color: #060913;
      font-weight: 700;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      cursor: pointer;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .file-preview {
      font-size: 12px;
      color: var(--accent-cyan);
      margin-bottom: 6px;
      padding-left: 12px;
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="brand-icon">✦</div>
      <span>NBSK AI</span>
    </div>

    <select id="modelSelect" class="model-select">
      <option value="gemini-2.5-flash">NBSK Fast (Flash)</option>
      <option value="gemini-2.5-pro">NBSK Deep Pro</option>
      <option value="search">Web Search Mode</option>
    </select>

    <button class="pro-badge" onclick="alert('Окно подписки NBSK Pro ($9.99/мес)')">PRO</button>
  </header>

  <main id="mainContainer">
    <div class="hero-screen" id="heroScreen">
      <div class="neural-orb"></div>
      <h1 class="hero-title">Чем помочь, создатель?</h1>
      <p class="hero-sub">Мультимодальный ИИ: текст, код, фото, голос и поиск в сети</p>

      <div class="quick-grid">
        <div class="quick-card" onclick="setPrompt('Реши задачу по фото или тексту пошагово: ')">
          <span>🧠</span>
          <b>Решить задачу</b>
          <small>Точный разбор</small>
        </div>
        <div class="quick-card" onclick="setPrompt('Сгенерируй изображение: ')">
          <span>🎨</span>
          <b>Создать арт</b>
          <small>Генерация фото</small>
        </div>
        <div class="quick-card" onclick="setPrompt('Найди актуальную информацию в интернете: ')">
          <span>🌐</span>
          <b>Поиск в сети</b>
          <small>Свежие факты</small>
        </div>
        <div class="quick-card" onclick="setPrompt('Напиши чистый код для: ')">
          <span>💻</span>
          <b>Написать код</b>
          <small>Python, JS, C++</small>
        </div>
      </div>
    </div>

    <div class="chat-box" id="chatBox"></div>
  </main>

  <div class="input-area">
    <div class="file-preview" id="filePreview"></div>
    <div class="input-wrap">
      <input type="file" id="fileInput" accept="image/*,.pdf,.txt" hidden onchange="handleFile(event)" />
      <button class="icon-btn" title="Прикрепить фото или файл" onclick="document.getElementById('fileInput').click()">📎</button>
      <button class="icon-btn" id="micBtn" title="Голосовой ввод" onclick="toggleVoice()">🎤</button>
      <textarea id="promptInput" rows="1" placeholder="Спросите NBSK AI о чём угодно..." onkeydown="handleEnter(event)"></textarea>
      <button class="send-btn" onclick="sendMessage()">➤</button>
    </div>
  </div>

  <script>
    // Укажи здесь путь к твоему API-эндпоинту в Cloudflare Worker
    const API_ENDPOINT = "/api/chat";
    let attachedFile = null;

    function setPrompt(text) {
      const input = document.getElementById("promptInput");
      input.value = text;
      input.focus();
    }
